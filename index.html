<script type="module">
  window.addEventListener("DOMContentLoaded", async () => {

    document.body.insertAdjacentHTML(
      "beforeend",
      `<div style="background:orange;color:white;padding:10px;">
         HTML SCRIPT RAN
       </div>`
    );

    try {
      const module = await import("https://stephen-d-bennett.github.io/dashboard-app/js/shared/app-loader.js");

      document.body.insertAdjacentHTML(
        "beforeend",
        `<div style="background:purple;color:white;padding:10px;">
           HTML IMPORT SUCCEEDED
         </div>`
      );

      module.start();

    } catch (err) {
      document.body.insertAdjacentHTML(
        "beforeend",
        `<div style="background:yellow;color:black;padding:10px;">
           HTML IMPORT FAILED: ${err.message}
         </div>`
      );
    }
  });
</script>
