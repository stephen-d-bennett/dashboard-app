<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard App</title>
    <link rel="manifest" href="/manifest.json">
</head>

<body>
    <div style="background:black;color:white;padding:10px;">
        URL: <script>document.write(location.href)</script>
    </div>

    <!-- The loader will build everything inside this -->
    <!-- <div id="app"></div> -->

    <!-- The ONLY script the HTML ever loads -->
<script type="module">
  window.addEventListener("DOMContentLoaded", async () => {

    // ORANGE -- proves the HTML script is running
    document.body.insertAdjacentHTML(
      "beforeend",
      `<div style="background:orange;color:white;padding:10px;">
         HTML SCRIPT RAN
       </div>`
    );

    try {
      const module = await import("/js/shared/app-loader.js");

      // PURPLE -- proves the import succeeded
      document.body.insertAdjacentHTML(
        "beforeend",
        `<div style="background:purple;color:white;padding:10px;">
           HTML IMPORT SUCCEEDED
         </div>`
      );

      module.start();

    } catch (err) {

      // YELLOW -- proves the import failed
      document.body.insertAdjacentHTML(
        "beforeend",
        `<div style="background:yellow;color:black;padding:10px;">
           HTML IMPORT FAILED: ${err.message}
         </div>`
      );
    }
  });
</script>

</body>
</html>
