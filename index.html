<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Cache control -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Shared CSS -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">

  <!-- v2 CSS (optional) -->
  <!-- 
    To enable v2 styles:
    <link rel="stylesheet" href="css/v2/v2.css">
  -->

  <!-- Theme script (always safe) -->
  <script src="js/theme.js" defer></script>

  <!-- 
    v1 SCRIPT SLOT (SAFE)
    This comment block is intentionally placed at the END of <head>,
    where it cannot affect parsing modes or implicit tag insertion.
    
    To enable v1 here (not recommended):
    <script src="js/app.js" defer></script>
  -->
</head>

<body>

  <!-- Layout -->
  <div id="layout">
    <div id="sidebar">
      <div id="sidebar-categories"></div>
      <div id="sidebar-settings">⚙️ Preferences</div>
    </div>

    <div id="main">
      <div id="content-panel"></div>
    </div>
  </div>

  <!-- Preferences Modal -->
  <div id="preferences-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Preferences</h2>

      <h3>Color Theme</h3>
      <div class="preset-colors">
        <button class="preset" data-color="#8b1e2f">Cardinal Red</button>
        <button class="preset" data-color="#1e3a8a">Marian Blue</button>
        <button class="preset" data-color="#2f6a4f">Forest Green</button>
        <button class="preset" data-color="#253544">Original</button>
      </div>

      <h3>Custom Color</h3>
      <input id="custom-color" type="text" placeholder="#253544">
      <button id="apply-custom">Apply</button>
      <button id="close-modal">Close</button>
    </div>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1"></script>

  <!-- 
    v1 SCRIPT (ACTIVE)
    This is the stable, safe location for v1.
    Toggle this ON/OFF freely.
  -->
  <script src="js/app.js" defer></script>

  <!-- 
    v2 SCRIPT (INACTIVE)
    Toggle this ON/OFF freely.
    This position is safe for module scripts.
    
    To enable v2:
    <script src="js/v2/app.js" type="module"></script>
  -->

</body>
</html>
