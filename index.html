<!DOCTYPE html>
<html lang="en">
	
	<head>
  		<meta charset="UTF-8">
  		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
  		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  		<meta http-equiv="Pragma" content="no-cache">
  		<meta http-equiv="Expires" content="0">
		
  		<link rel="stylesheet" href="css/theme.css">
  		<link rel="stylesheet" href="css/app.css">
		
  		<script src="js/theme.js" defer></script>
  		<script src="js/app.js" defer></script>
	</head>
			  
	<body>
		
  		<div id="layout">
    		<div id="sidebar"></div>
    		<div id="main">
    			<div id="settings-gear">⚙️</div>
      			<div id="content-panel"></div>
    		</div>
  		</div>
  		
  		
  		<div id="preferences-modal" class="modal hidden">
  			
  			<div class="modal-content">
    			
    			<h2>Preferences</h2>
				
    			<h3>Color Theme</h3>
				
    			<div class="preset-colors">
      				<button class="preset" data-color="#8b1e2f">Cardinal Red</button>
      				<button class="preset" data-color="#1e3a8a">Marian Blue</button>
      				<button class="preset" data-color="#2f6a4f">Forest Green</button>
      				<button class="preset" data-color="#253544">Original</button>
    			</div>
				
    			<h3>Custom Color</h3>
    			<input id="custom-color" type="text" placeholder="#253544">
				
    			<button id="apply-custom">Apply</button>
    			<button id="close-modal">Close</button>
  			</div>
		</div>
	
  		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1"></script>
  		<script src="js/app.js" defer></script>
		
	</body>

</html>
