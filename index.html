<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard App</title>
    <link rel="manifest" href="/manifest.json">
</head>

<body>
    <div style="background:black;color:white;padding:10px;">
        URL: <script>document.write(location.href)</script>
    </div>

    <!-- The loader will build everything inside this -->
    <!-- <div id="app"></div> -->

    <!-- The ONLY script the HTML ever loads -->
    <script type="module">
      window.addEventListener("DOMContentLoaded", async () => {
        const { start } = await import("/js/shared/app-loader.js");
        start();
      });
    </script>
</body>
</html>
