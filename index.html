<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>App</title>
    <!-- Loader controls everything -->
    <script type="module" src="js/shared/app-loader.js"></script>
</head>

<body>

    <div id="layout">
        
        <aside id="sidebar">

            <!-- Header at the top -->
            <div id="sidebar-header">
                <h2>Topics</h2>
            </div>

            <!-- Scrollable categories in the middle -->
            <div id="sidebar-categories"></div>
            
            <!-- Preferences button at the bottom -->
            <div id="sidebar-settings">⚙️</div>

        </aside>
        
        <!-- ========================= -->
        <!--        MAIN PANEL         -->
        <!-- ========================= -->
        
        <div id="main">
            <div id="content-panel"></div>
        </div>
    </div>

    <!-- ========================= -->
    <!--     PREFERENCES MODAL     -->
    <!-- ========================= -->
    
    <div id="preferences-modal" class="modal hidden">
        <div class="modal-content">
            
            <h3>Preferences</h3>
            
            <div class="preset-colors">
                <button class="preset" data-color="#8B1E2F">Cardinal Red</button>
                <button class="preset" data-color="#1F3B73">Marian Blue</button>
                <button class="preset" data-color="#1E4D2B">Forest Green</button>
            </div>
            
            <label for="custom-color">Custom Color</label>
            <input id="custom-color" type="text" placeholder="#253544">
            
            <button id="apply-custom">Apply</button>
            <button id="close-modal">Close</button>
        
        </div>
    </div>
    
    <div id="about-modal" class="hidden about-modal">
      <div class="about-content">
        <h2>About This App</h2>
        <p><strong>Version:</strong> <span id="about-version"></span></p>
        <p><strong>Loader:</strong> <span id="about-loader"></span></p>
        <p><strong>Runtime:</strong> <span id="about-runtime"></span></p>
        <p><strong>HUD:</strong> <span id="about-hud"></span></p>
        <p><strong>Debug:</strong> <span id="about-debug"></span></p>
        <p><strong>Theme Engine:</strong> <span id="about-theme"></span></p>
        <p><strong>Supabase:</strong> <span id="about-supabase"></span></p>
        <p><strong>Build:</strong> <span id="about-build"></span></p>
        <button id="about-close">Close</button>
      </div>
    </div>

    <button id="help-about" class="help-button">Help → About</button>

</body>
</html>
