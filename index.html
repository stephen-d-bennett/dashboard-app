<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Cache control -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Shared CSS -->
  <link rel="stylesheet" href="css/theme.css">

  <link rel="stylesheet" href="css/app.css">

  <!-- loader.js chooses correct stylesheet -->
  <!-- <link id="css-loader" rel="stylesheet" href="css/app.css"> -->
  
  <!-- Theme script shared -->
  <script src="js/theme.js" defer></script>

</head>

<body>

  <!-- Layout -->
  <div id="layout">
    <div id="sidebar">
      <div id="sidebar-categories"></div>
      <div id="sidebar-settings">⚙️ Preferences</div>
    </div>

    <div id="main">
      <div id="content-panel"></div>
    </div>
  </div>

  <!-- Preferences Modal -->
  <div id="preferences-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Preferences</h2>

      <h3>Color Theme</h3>
      <div class="preset-colors">
        <button class="preset" data-color="#8b1e2f">Cardinal Red</button>
        <button class="preset" data-color="#1e3a8a">Marian Blue</button>
        <button class="preset" data-color="#2f6a4f">Forest Green</button>
        <button class="preset" data-color="#253544">Original</button>
      </div>

      <h3>Custom Color</h3>
      <input id="custom-color" type="text" placeholder="#253544">
      <button id="apply-custom">Apply</button>
      <button id="close-modal">Close</button>
    </div>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1"></script>

  <!-- loader.js loads correct app.js/app.css -->
  <!-- <script type="module" src="./js/loader.js"></script> -->
  <script src="js/app.js"></script>


</body>
</html>
