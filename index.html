<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Catholic Topics Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      background: #f5f5f5;
    }

    /* Sidebar */
    #sidebar {
      width: 260px;
      background: #2c3e50;
      color: white;
      padding: 20px;
      overflow-y: auto;
    }

    #sidebar h2 {
      margin-top: 0;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .category {
      padding: 10px;
      margin-bottom: 5px;
      background: #34495e;
      border-radius: 4px;
      cursor: pointer;
    }

    .category:hover {
      background: #3d566e;
    }

    /* Main content area */
    #main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .topic-card {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #ddd;
    }

    .topic-card:hover {
      background: #f0f0f0;
    }

    /* Article viewer */
    #article h1 {
      margin-top: 0;
    }

    .text-block {
      margin-bottom: 15px;
      line-height: 1.5;
    }

    ol {
      margin-left: 20px;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <h2>Categories</h2>
    <div id="category-list">Loading...</div>
  </div>

  <!-- Main content -->
  <div id="main">
    <h1>Topics</h1>
    <div id="topic-list">Loading...</div>
    <div id="article"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    const SUPABASE_URL = "https://yykqbqdosdvigghaguvd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5a3FicWRvc2R2aWdnaGFndXZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMjg4MDIsImV4cCI6MjA5OTgwNDgwMn0.u-luZHqcc9aeHLGHIrWOPaK4vVXIHmwv3r3yZVvW7DU";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadTopics() {
      const { data, error } = await client
        .from("Catholic-Topics")
        .select("*")
        .order("title");

      if (error) {
        document.getElementById("topic-list").textContent = "Error loading topics.";
        return;
      }

      renderCategories(data);
      renderTopicList(data);
    }

    function renderCategories(data) {
      const categories = [...new Set(data.map(item => item.category))];
      const container = document.getElementById("category-list");
      container.innerHTML = "";

      categories.forEach(cat => {
        const div = document.createElement("div");
        div.className = "category";
        div.textContent = cat;
        div.onclick = () => filterByCategory(cat, data);
        container.appendChild(div);
      });
    }

    function renderTopicList(data) {
      const container = document.getElementById("topic-list");
      container.innerHTML = "";

      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "topic-card";
        card.textContent = item.title;
        card.onclick = () => renderArticle(item);
        container.appendChild(card);
      });
    }

    function filterByCategory(category, data) {
      const filtered = data.filter(item => item.category === category);
      renderTopicList(filtered);
      document.getElementById("article").innerHTML = "";
    }

    function renderArticle(item) {
      const container = document.getElementById("article");
      container.innerHTML = `<h1>${item.title}</h1>`;

      item.content.content.forEach(block => {
        if (block.type === "text_block") {
          block.content.forEach(text => {
            const p = document.createElement("p");
            p.className = "text-block";
            p.textContent = text;
            container.appendChild(p);
          });
        }

        if (block.type === "numbered_list") {
          const ol = document.createElement("ol");
          block.content.forEach(li => {
            const item = document.createElement("li");
            item.textContent = li;
            ol.appendChild(item);
          });
          container.appendChild(ol);
        }
      });
    }

    loadTopics();
  </script>

</body>
</html>
